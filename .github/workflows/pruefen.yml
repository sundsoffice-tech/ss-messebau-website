# Tests und Build für jeden Pull Request auf main, bevor er gemergt wird.
# Bisher lief npm test nur im Deploy nach dem Merge: Ein roter Test hielt dann jeden weiteren Deploy
# der Seite auf, bis jemand ihn reparierte (Spieltheoretiker 11.11.2026). Hier trifft er den PR, der
# ihn verursacht. Kein Deploy, keine Geheimnisse: Auslöser pull_request (nicht pull_request_target),
# das Token darf nur lesen, auch bei PRs aus Forks.
name: Prüfen (Tests und Build)

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruefen-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    name: npm test und Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Build-Ausgabe prüfen
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html fehlt"; exit 1; }
          grep -q '<div id="root">' dist/index.html || { echo "::error::#root fehlt in dist/index.html"; exit 1; }
          test -f dist/_s/kontakt.html || { echo "::error::dist/_s/ fehlt (scripts/seiten-vorab.mjs)"; exit 1; }
          test -f dist/.htaccess || { echo "::error::dist/.htaccess fehlt"; exit 1; }
          echo "Build vollständig"
