# NOTE: This workflow is now OPTIONAL since the auto-build.yml workflow
# commits the dist/ folder directly to the main branch.
# Hostinger can deploy directly from the main branch instead of using this separate hostinger branch.
# This workflow is kept as a backup deployment option.
name: Deploy to Hostinger (Git)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build and Deploy to Hostinger Branch
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
      
      - name: Verify build output
        run: |
          echo "Checking for index.html in dist/"
          if [ ! -f "dist/index.html" ]; then
            echo "❌ ERROR: index.html not found in dist/"
            echo "Build failed - cannot deploy without index.html"
            exit 1
          fi

          if ! grep -q '<div id="root">' dist/index.html; then
            echo "❌ ERROR: root mount element missing in dist/index.html"
            exit 1
          fi

          if [ ! -f "dist/.htaccess" ]; then
            echo "❌ ERROR: .htaccess not found in dist/ (Hostinger SPA routing would break)"
            exit 1
          fi

          echo "✅ index.html, #root mount point und .htaccess sind vorhanden"

          echo ""
          echo "Build directory contents:"
          ls -lah dist/

          echo ""
          echo "Total build size:"
          du -sh dist/

      - name: Deploy to hostinger branch
        run: |
          echo "🚀 Preparing deployment to hostinger branch..."
          
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Build-Output sichern
          TEMP_DIR=$(mktemp -d)
          echo "Using temp directory: $TEMP_DIR"
          
          cp -a dist/* "$TEMP_DIR/"
          cp -a dist/.htaccess "$TEMP_DIR/" 2>/dev/null || true
          
          COMMIT_SHA=$(git rev-parse --short HEAD)
          
          # Bestehenden hostinger Branch auschecken (oder neu erstellen)
          echo "Fetching hostinger branch..."
          git fetch origin hostinger || true
          
          # Remove dist/ to prevent git conflict when switching branches
          echo "Cleaning dist/ directory before branch switch..."
          git rm -rf dist/ 2>/dev/null || true
          rm -rf dist/
          
          if git rev-parse --verify origin/hostinger >/dev/null 2>&1; then
            echo "✓ Hostinger branch exists, checking out..."
            git checkout hostinger
            git pull origin hostinger || true
          else
            echo "✓ Creating new hostinger branch..."
            git checkout --orphan hostinger
            git rm -rf . 2>/dev/null || true
          fi
          
          # Alte Dateien entfernen
          echo "Cleaning old files..."
          git rm -rf . 2>/dev/null || true
          rm -rf node_modules/ dist/ .gitignore 2>/dev/null || true
          
          # Neue Build-Dateien kopieren
          echo "Copying new build files..."
          cp -a "$TEMP_DIR"/* .
          cp -a "$TEMP_DIR"/.htaccess . 2>/dev/null || true
          
          # Normal committen und pushen (KEIN --force!)
          git add -A
          
          COMMIT_MSG="Deploy from main @ ${COMMIT_SHA} - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "$COMMIT_MSG"
            git push origin hostinger
            echo "✅ Deployment to hostinger branch completed!"
          fi

      - name: Hostinger ziehen lassen (SSH git pull) und Live messen
        # Hostinger zieht den Branch nicht von selbst (Webhook antwortet 200, tut
        # nichts - gemessen 21.08.2026). Deshalb loest dieser Schritt den Pull auf
        # dem Hosting-Konto selbst aus. Der Key ist dort per authorized_keys auf
        # genau diesen Befehl beschraenkt (command="..."), kann also nur deployen.
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_HOST: sunds-messebau.de
          HOSTINGER_PORT: "65002"
          HOSTINGER_USER: u605792113
          HOSTINGER_PATH: domains/sunds-messebau.de/public_html
          LIVE_URL: https://sunds-messebau.de/
        run: |
          if [ -z "$HOSTINGER_SSH_KEY" ]; then
            echo "::warning::Secret HOSTINGER_SSH_KEY fehlt - Pull uebersprungen. Manuell: hPanel -> GIT -> Bereitstellen"
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" > ~/.ssh/hostinger_ci && chmod 600 ~/.ssh/hostinger_ci
          ssh-keyscan -p "$HOSTINGER_PORT" "$HOSTINGER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "-> git pull auf $HOSTINGER_HOST:$HOSTINGER_PATH"
          ssh -i ~/.ssh/hostinger_ci -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
              -p "$HOSTINGER_PORT" "$HOSTINGER_USER@$HOSTINGER_HOST" \
              "cd $HOSTINGER_PATH && git pull --ff-only origin hostinger && git log --oneline -1"
          rm -f ~/.ssh/hostinger_ci

          # Messen statt vermuten: Live muss das Bundle aus dem hostinger-Branch liefern.
          ERWARTET=$(grep -o 'assets/index-[^"]*\.js' index.html | head -1)
          LIVE=""
          for i in $(seq 1 12); do
            LIVE=$(curl -s --max-time 20 -H 'Cache-Control: no-cache' "$LIVE_URL" | grep -o 'assets/index-[^"]*\.js' | head -1 || true)
            [ "$LIVE" = "$ERWARTET" ] && break
            sleep 5
          done
          echo "erwartet: $ERWARTET"
          echo "live:     $LIVE"
          if [ "$LIVE" != "$ERWARTET" ]; then
            echo "::error::Live liefert nicht das deployte Bundle. Manuell pruefen: hPanel -> GIT -> Letzte Build-Ausgabe / Bereitstellen"
            exit 1
          fi
          echo "Live = Branch. Deploy angekommen."

      - name: Deployment Summary
        if: success()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ DEPLOYMENT SUCCESSFUL"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "📋 Deployment Details:"
          echo "   • Source Branch: main"
          echo "   • Target Branch: hostinger"
          echo "   • Build Output: dist/ → hostinger branch root"
          echo ""
          echo "🌐 Hostinger hat per SSH gezogen; Live wurde gegen das Bundle gemessen."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
